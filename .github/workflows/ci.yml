name: CI

on:
  pull_request:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for the checked-out branch
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx jsr publish --dry-run

  publish-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: preview
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed.txt
          if ! curl -fsSL https://jsr.io/@readyrun/readyrun/meta.json -o /tmp/jsr-meta.json; then
            {
              echo "detail<<EOF"
              echo "Could not fetch jsr.io metadata; skipping publish preview."
              echo "EOF"
              echo "markdown<<EOF"
              echo "Could not fetch jsr.io metadata; skipping publish preview."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/publish-preview.ts \
            --jsr jsr.json \
            --meta /tmp/jsr-meta.json \
            --changed-files /tmp/changed.txt
      - name: Post publish preview as an informational PR comment
        env:
          DETAIL: ${{ steps.preview.outputs.detail }}
          MARKDOWN: ${{ steps.preview.outputs.markdown }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DETAIL" | tee -a "$GITHUB_STEP_SUMMARY"
          MARKER="<!-- readyrun-publish-preview -->"
          {
            printf '%s\n\n' "$MARKER"
            printf '%s\n' "$MARKDOWN"
          } > /tmp/comment.md
          EXISTING="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | awk 'NR==1')"
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${EXISTING}" -F body=@/tmp/comment.md
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@/tmp/comment.md
          fi
          echo "::notice::${DETAIL}"

  bump:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/bump'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require a maintainer to trigger a /bump comment
        if: github.event_name == 'issue_comment'
        env:
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "::error::Only maintainers can trigger /bump (got: $ASSOCIATION)."
              exit 1
              ;;
          esac
      - name: Resolve target branch, bump kind, and PR number
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_BUMP: ${{ inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "spec=$DISPATCH_BUMP" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
          else
            REF="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName -q .headRefName)"
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            echo "spec=$(echo "$COMMENT" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: bump
        env:
          SPEC: ${{ steps.target.outputs.spec }}
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/bump.ts ${SPEC:+"$SPEC"})"
          echo "$OUTPUT"
          VERSION="${OUTPUT##* → }"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and push the bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json jsr.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${{ steps.target.outputs.ref }}"
      - name: Confirm on the PR
        if: steps.target.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "${{ steps.target.outputs.pr }}" --repo "$REPO" \
            --body "Bumped to \`v${{ steps.bump.outputs.version }}\`. Merging this PR will publish it."
      - name: Summary
        if: steps.target.outputs.pr == ''
        run: |
          echo "::notice::Bumped ${{ steps.target.outputs.ref }} to v${{ steps.bump.outputs.version }}."

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: check
        run: |
          set -euo pipefail
          curl -fsSL https://jsr.io/@readyrun/readyrun/meta.json -o /tmp/jsr-meta.json || echo '{}' > /tmp/jsr-meta.json
          node scripts/should-publish.ts --jsr jsr.json --meta /tmp/jsr-meta.json
      - run: npx jsr publish
        if: steps.check.outputs.shouldPublish == 'true'
