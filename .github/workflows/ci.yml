name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for this release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx jsr publish --dry-run

  publish-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: preview
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD > /tmp/changed.txt
          if ! curl -fsSL https://jsr.io/@readyrun/readyrun/meta.json -o /tmp/jsr-meta.json; then
            {
              echo "detail<<EOF"
              echo "Could not fetch jsr.io metadata; skipping publish preview."
              echo "EOF"
              echo "markdown<<EOF"
              echo "Could not fetch jsr.io metadata; skipping publish preview."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/publish-preview.ts \
            --jsr jsr.json \
            --meta /tmp/jsr-meta.json \
            --changed-files /tmp/changed.txt
      - name: Post publish preview as an informational PR comment
        env:
          DETAIL: ${{ steps.preview.outputs.detail }}
          MARKDOWN: ${{ steps.preview.outputs.markdown }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DETAIL" | tee -a "$GITHUB_STEP_SUMMARY"
          MARKER="<!-- readyrun-publish-preview -->"
          {
            printf '%s\n\n' "$MARKER"
            printf '%s\n' "$MARKDOWN"
          } > /tmp/comment.md
          EXISTING="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | awk 'NR==1')"
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${EXISTING}" -F body=@/tmp/comment.md
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@/tmp/comment.md
          fi
          echo "::notice::${DETAIL}"

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: bump
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/bump.ts "${{ inputs.bump }}")"
          echo "$OUTPUT"
          VERSION="${OUTPUT##* → }"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and tag the release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json jsr.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ steps.bump.outputs.version }}"
      - run: npx jsr publish
